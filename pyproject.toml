[project]
name = "data-analysis"
version = "0.1.0"
description = "Spatial-temporal logistics fleet performance analysis and dashboard"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "h3>=4.0",
    "numpy>=1.24",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=14.0",
    "pydeck>=0.9",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
